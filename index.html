<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>订单生成器 - 配置订单数据</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff5000'/%3E%3Cpath d='M9 12 h14 M9 17 h14 M9 22 h9' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f4f4;
    --card: #fff;
    --orange: #ff5000;
    --orange-deep: #ff4400;
    --text: #333;
    --sub: #999;
    --line: #ececec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
    min-height: 100dvh;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  .top {
    background: linear-gradient(135deg, #ff7000, #ff4400);
    color: #fff;
    padding: 26px 20px 22px;
  }
  .top h1 { font-size: 20px; font-weight: 700; }
  .top p { font-size: 13px; opacity: .9; margin-top: 6px; line-height: 1.5; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px; }

  .card {
    background: var(--card);
    border-radius: 12px;
    margin-top: 12px;
    padding: 14px 16px;
  }
  .card h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .card h2 .dot { width: 4px; height: 14px; border-radius: 2px; background: var(--orange); }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
  .field label .opt { color: #ccc; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid #e5e5e5; border-radius: 8px;
    padding: 10px 12px; font-size: 16px; font-family: inherit;
    outline: none; background: #fafafa; color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--orange); background: #fff; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; min-width: 0; }

  /* 商品图 */
  .img-row { display: flex; gap: 12px; align-items: flex-start; }
  .img-preview {
    width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
    background: #f0f0f0; border: 1px solid var(--line); flex-shrink: 0;
  }
  .img-ops { flex: 1; min-width: 0; }
  .img-ops input { margin-bottom: 8px; }
  .img-ops .ops { display: flex; gap: 14px; font-size: 13px; }
  .link-btn { color: var(--orange); cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; font-size: 13px; padding: 0; }
  .img-tip { font-size: 11px; color: #c0c0c0; margin-top: 6px; line-height: 1.5; }

  /* 订单号 */
  .oid-row { display: flex; gap: 8px; }
  .oid-row input { flex: 1; min-width: 0; }
  .mini-btn {
    flex-shrink: 0; border: 1px solid #ffd0b0; background: #fff5ee; color: var(--orange);
    border-radius: 8px; padding: 0 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .mini-btn:active { opacity: .75; }

  /* 实时预览 */
  .preview-shell {
    position: relative; width: 100%; aspect-ratio: 390 / 820;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
    background: #fff;
  }
  .preview-shell iframe {
    position: absolute; top: 0; left: 0;
    width: 390px; height: 820px;
    border: none; transform-origin: 0 0;
  }
  .preview-note { font-size: 11px; color: #c0c0c0; margin-top: 8px; line-height: 1.6; }

  /* 底部操作 */
  .actions {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 508px;
    background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; z-index: 20;
    box-shadow: 0 -2px 12px rgba(0,0,0,.06);
  }
  .actions button {
    height: 44px; border-radius: 22px; font-size: 15px; cursor: pointer; font-family: inherit;
    border: none; min-width: 0;
  }
  .btn-copy { flex: .8; background: #f5f5f5; color: #666; }
  .btn-reset { flex: .7; background: #f5f5f5; color: #666; }
  .btn-gen {
    flex: 1.6; background: linear-gradient(90deg, #ff7000, #ff4400);
    color: #fff; font-weight: 600; letter-spacing: 1px;
    box-shadow: 0 4px 12px rgba(255,80,0,.35);
  }
  .actions button:active { opacity: .85; }

  .toast {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,.75); color: #fff; font-size: 14px;
    padding: 10px 20px; border-radius: 8px; z-index: 99;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* 桌面端：左表单 + 右预览 */
  @media (min-width: 900px) {
    .layout { display: flex; gap: 20px; align-items: flex-start; max-width: 900px; margin: 0 auto; padding: 16px 20px 20px; }
    .col-form { flex: 1.1; min-width: 0; }
    .col-preview { flex: 1; position: sticky; top: 16px; }
    .col-preview .sticky-label { font-size: 13px; color: var(--sub); margin: 4px 0 10px 4px; }
  }
  @media (max-width: 899px) {
    .col-preview { display: none; }
    .mobile-preview-toggle { display: block; }
  }
  .mobile-preview-toggle { display: none; }
  .pv-fab {
    display: none;
    position: fixed; right: 14px; bottom: calc(72px + env(safe-area-inset-bottom));
    height: 36px; padding: 0 14px; border-radius: 18px; border: none;
    background: #333; color: #fff; font-size: 13px; cursor: pointer;
    z-index: 15; box-shadow: 0 4px 10px rgba(0,0,0,.2); font-family: inherit;
  }
  @media (max-width: 899px) {
    .pv-fab { display: flex; align-items: center; }
  }

  /* 移动端预览抽屉 */
  .pv-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: none; }
  .pv-mask.show { display: block; }
  .pv-drawer {
    position: fixed; bottom: 0; left: 50%; transform: translate(-50%, 105%);
    width: 100%; max-width: 480px; max-height: 88dvh;
    background: #fff; border-radius: 16px 16px 0 0; z-index: 50;
    padding: 16px; transition: transform .28s ease; overflow: hidden;
  }
  .pv-drawer.show { transform: translate(-50%, 0); }
  .pv-drawer .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; font-weight: 700; }
  .pv-drawer .head .close { font-size: 22px; color: #999; cursor: pointer; font-weight: 400; }
  .pv-drawer .preview-shell { aspect-ratio: 390 / 700; }
  .pv-drawer iframe { height: 700px; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap" style="padding:0">
    <h1>订单详情生成器</h1>
    <p>填写商品图、标题、收货地址、金额、下单时间，点击「生成订单详情」即刻预览，并可一键复制带参数的分享链接。</p>
  </div>
</header>

<div class="layout">
  <div class="col-form">
    <div class="wrap" style="padding:0">

      <!-- 商品信息 -->
      <div class="card">
        <h2><span class="dot"></span>商品信息</h2>
        <div class="field">
          <label>商品图片</label>
          <div class="img-row">
            <img class="img-preview" id="img-preview" src="img/product.jpg" alt="预览">
            <div class="img-ops">
              <input type="text" id="f-imageUrl" placeholder="图片 URL（https://...）">
              <div class="ops">
                <button class="link-btn" onclick="document.getElementById('f-imgfile').click()">上传本地图片</button>
                <button class="link-btn" onclick="useDefaultImage()">使用默认图</button>
              </div>
              <input type="file" id="f-imgfile" accept="image/*" style="display:none">
              <div class="img-tip">本地图片会转为 base64 内嵌，链接会较长；对外分享建议使用图片 URL。</div>
            </div>
          </div>
        </div>
        <div class="field">
          <label>商品标题</label>
          <textarea id="f-title"></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label>商品规格 <span class="opt">(选填)</span></label>
            <input type="text" id="f-spec">
          </div>
          <div class="field" style="max-width:90px">
            <label>数量</label>
            <input type="text" id="f-qty" inputmode="numeric">
          </div>
        </div>
      </div>

      <!-- 金额 -->
      <div class="card">
        <h2><span class="dot"></span>金额</h2>
        <div class="row2">
          <div class="field">
            <label>实付金额 (¥)</label>
            <input type="text" id="f-price" inputmode="decimal">
          </div>
          <div class="field">
            <label>原价 (¥) <span class="opt">(选填)</span></label>
            <input type="text" id="f-origPrice" inputmode="decimal">
          </div>
        </div>
      </div>

      <!-- 收货信息 -->
      <div class="card">
        <h2><span class="dot"></span>收货信息</h2>
        <div class="row2">
          <div class="field">
            <label>收货人</label>
            <input type="text" id="f-name">
          </div>
          <div class="field">
            <label>电话</label>
            <input type="text" id="f-phone">
          </div>
        </div>
        <div class="field">
          <label>收货地址</label>
          <textarea id="f-address" placeholder="广东省 佛山市 南海区 XX镇 XX路 XX号"></textarea>
        </div>
      </div>

      <!-- 下单时间 -->
      <div class="card">
        <h2><span class="dot"></span>下单时间</h2>
        <div class="field">
          <label>创建时间</label>
          <input type="datetime-local" id="f-createTime" step="1">
        </div>
        <div class="row2">
          <div class="field">
            <label>付款时间</label>
            <input type="datetime-local" id="f-payTime" step="1">
          </div>
          <div class="field">
            <label>发货时间</label>
            <input type="datetime-local" id="f-shipTime" step="1">
          </div>
        </div>
      </div>

      <!-- 订单与店铺 -->
      <div class="card">
        <h2><span class="dot"></span>订单与店铺</h2>
        <div class="field">
          <label>订单号</label>
          <div class="oid-row">
            <input type="text" id="f-orderId" inputmode="numeric">
            <button class="mini-btn" onclick="genOrderId()">随机生成</button>
          </div>
        </div>
        <div class="field">
          <label>店铺名称</label>
          <input type="text" id="f-shopName">
        </div>
        <div class="field">
          <label>订单状态</label>
          <select id="f-status">
            <option>已签收</option>
            <option>待收货</option>
            <option>待发货</option>
            <option>运输中</option>
          </select>
        </div>
      </div>

    </div>
  </div>

  <!-- 桌面端实时预览 -->
  <div class="col-preview">
    <div class="sticky-label">实时预览（随左侧表单自动更新）</div>
    <div class="preview-shell"><iframe id="preview" src="order.html" title="订单详情预览"></iframe></div>
  </div>
</div>

<!-- 底部操作 -->
<div class="actions">
  <button class="btn-copy" onclick="copyLink()">复制链接</button>
  <button class="btn-reset" onclick="resetForm()">重置</button>
  <button class="btn-gen" onclick="generate()">生成订单详情</button>
</div>

<!-- 移动端预览入口 -->
<button class="pv-fab" onclick="openPv()">👁 预览效果</button>

<!-- 移动端预览抽屉 -->
<div class="pv-mask" id="pv-mask" onclick="closePv()"></div>
<div class="pv-drawer" id="pv-drawer">
  <div class="head">订单详情预览 <span class="close" onclick="closePv()">×</span></div>
  <div class="preview-shell"><iframe id="preview-m" src="order.html" title="订单详情预览"></iframe></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 默认数据 ================= */
const DEFAULTS = {
  imageUrl: 'img/product.jpg',
  title: '新款波点韩系合金椭圆发夹高级滴油侧边少女时尚刘海发卡鸭嘴头饰',
  spec: '蓝咖撞色波点BB夹【四件套】',
  qty: '1',
  price: '4.99',
  origPrice: '5.99',
  name: '困',
  phone: '86-189****0880',
  address: '广东省 佛山市 南海区 里水镇 ********************',
  orderId: '5127217527457057230',
  createTime: '2026-09-01T16:39:46',
  payTime: '2026-09-01T16:39:48',
  shipTime: '2026-09-01T17:55:52',
  shopName: '万千少女梦',
  status: '已签收'
};

const $ = id => document.getElementById(id);

/* 表单字段 id 映射 */
const FIELDS = ['imageUrl','title','spec','qty','price','origPrice','name','phone',
                'address','orderId','createTime','payTime','shipTime','shopName','status'];

/* ================= 预填：URL 参数优先 ================= */
function prefill() {
  const qs = new URLSearchParams(location.search);
  for (const key of FIELDS) {
    const v = qs.get(key);
    $( 'f-' + key ).value = v !== null && v !== '' ? v : DEFAULTS[key];
  }
  updatePreviewImage();
}

/* ================= 收集 & 构建参数 ================= */
function collect() {
  const data = {};
  for (const key of FIELDS) {
    data[key] = $('f-' + key).value.trim() || DEFAULTS[key];
  }
  return data;
}

function buildQuery(data) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(data)) {
    if (v && String(v) !== String(DEFAULTS[k] ?? '')) qs.set(k, v);
  }
  return qs.toString();
}

/* ================= 实时预览 ================= */
let previewTimer;
function updatePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    const q = buildQuery(collect());
    const src = 'order.html' + (q ? '?' + q : '');
    $('preview').src = src;
    $('preview-m').src = src;
  }, 400);
}
function updatePreviewImage() {
  $('img-preview').src = $('f-imageUrl').value || DEFAULTS.imageUrl;
}

/* 输入即刷新预览 */
FIELDS.forEach(key => {
  const el = $('f-' + key);
  el.addEventListener('input', () => { if (key === 'imageUrl') updatePreviewImage(); updatePreview(); });
  el.addEventListener('change', updatePreview);
});

/* iframe 按容器宽度等比缩放 */
function fitPreview() {
  document.querySelectorAll('.preview-shell').forEach(shell => {
    const f = shell.querySelector('iframe');
    if (!f) return;
    const w = shell.clientWidth;
    f.style.transform = 'scale(' + (w / 390) + ')';
  });
}
window.addEventListener('resize', fitPreview);

/* ================= 本地图片 ================= */
$('f-imgfile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    $('f-imageUrl').value = ev.target.result;
    updatePreviewImage();
    updatePreview();
  };
  reader.readAsDataURL(file);
});
function useDefaultImage() {
  $('f-imageUrl').value = DEFAULTS.imageUrl;
  updatePreviewImage();
  updatePreview();
  toast('已使用默认商品图');
}

/* ================= 操作 ================= */
function generate() {
  const q = buildQuery(collect());
  location.href = 'order.html' + (q ? '?' + q : '');
}

function copyLink() {
  const q = buildQuery(collect());
  const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'order.html' + (q ? '?' + q : '');
  const long = url.length > 8000;
  const done = () => toast(long ? '链接已复制（较长，因图片为本地内嵌）' : '链接已复制');
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => toast('复制失败'));
  else toast('复制失败');
}

function resetForm() {
  for (const key of FIELDS) $('f-' + key).value = DEFAULTS[key];
  updatePreviewImage();
  updatePreview();
  toast('已恢复默认数据');
}

function genOrderId() {
  let s = '5';
  for (let i = 0; i < 18; i++) s += Math.floor(Math.random() * 10);
  $('f-orderId').value = s;
  updatePreview();
  toast('已生成随机订单号');
}

/* 移动端预览抽屉 */
function openPv() { $('pv-mask').classList.add('show'); $('pv-drawer').classList.add('show'); fitPreview(); }
function closePv() { $('pv-mask').classList.remove('show'); $('pv-drawer').classList.remove('show'); }

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* 初始化 */
prefill();
fitPreview();
updatePreview();
</script>
</body>
</html>
